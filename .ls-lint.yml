# ls-lint configuration
# Enforces file naming conventions. Next.js dictates some names in apps/hub
# (page.tsx, layout.tsx), which are kebab-case anyway. Directory names are not
# checked, so App Router segments like [id] and (app) are unaffected.

ls:
  tests:
    .ts: kebab-case

  scripts:
    .mjs: kebab-case
    .html: kebab-case

  apps/hub/src:
    .ts: kebab-case
    .tsx: kebab-case

  apps/hub/tests:
    .ts: kebab-case
    .tsx: kebab-case

  packages/identity/src:
    .ts: kebab-case

  packages/identity/tests:
    .ts: kebab-case

ignore:
  - node_modules
  - .git
  - dist
  - build
  - coverage
  - .pnpm-store
  - .claude
  - .github
  - .husky
  - .vscode
  - .superpowers
  - docs
  - supabase
  - apps/hub/.next
