# Sync secrets — packages GitHub repository secrets into an encrypted artifact
# for local download. Triggered by scripts/sync-secrets.mjs via `gh workflow run`.
#
# The workflow writes the secrets to a file, encrypts it with a one-time
# passphrase provided as input, uploads the encrypted artifact (1-day
# retention), and deletes the unencrypted file.
#
# This workflow is dispatch-only by design (no schedule).
#
# Scope — why this list is short:
#
#   AeleOS is not deployable and has no Supabase Cloud project (the free plan
#   allows two; Puck and CandyStore hold both). The local stack's URL, anon key,
#   service-role key, DB URL and JWT secret are read from `supabase status` at
#   run time by tests/db/global-setup.ts and tests/idp/global-setup.ts — they are
#   generated locally, not secrets, and must never be synced. So the only real
#   repository secrets are Clerk's. Extend this list when a phase actually
#   introduces a secret; do not pre-populate it with a sister repo's deploy
#   credentials.
#
# CLERK_SESSION_TOKEN is deliberately NOT synced. It is a short-lived (~60s)
# session JWT captured locally with `pnpm capture:token`; a synced copy would be
# expired before it arrived. The file carries an empty placeholder so its shape
# matches .secrets.example — capture the token after syncing, never before,
# because a sync overwrites .secrets in full.

name: Sync Secrets

on:
  workflow_dispatch:
    inputs:
      passphrase:
        description: "One-time encryption passphrase (generated by sync-secrets.mjs)"
        required: true
        type: string

permissions:
  actions: write

jobs:
  package-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Write secrets to file
        # env: below is the ONLY list. The loop discovers names from the
        # environment, so the output cannot fall behind it — the two-list shape
        # this replaced is what let 17 of libra's 64 secrets go unwritten for
        # months (see libra#335). Adding a secret means adding one line here.
        env:
          S_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          S_CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          S_CLERK_DOMAIN: ${{ secrets.CLERK_DOMAIN }}
          S_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          S_SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          S_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          S_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          S_SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          S_CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          S_VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          S_VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          S_VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          S_VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          S_GH_TOKEN: ${{ secrets.GH_TOKEN }}
        shell: bash
        run: |
          # Spot-check that the context really is this repository's, rather
          # than maintaining a second inventory that can drift.
          MISSING=""
          for KEY in S_CLERK_PUBLISHABLE_KEY S_CLERK_SECRET_KEY S_CLERK_DOMAIN; do
            VAL=$(printenv "$KEY" || true)
            if [ -z "$VAL" ]; then
              MISSING="$MISSING ${KEY#S_}"
            fi
          done

          if [ -n "$MISSING" ]; then
            echo "::error::Missing required GitHub secrets:$MISSING — set them with 'gh secret set <NAME>'. See docs/phase-0-clerk-setup.md."
            exit 1
          fi

          {
            echo "# Auto-generated by the sync-secrets workflow — do not edit manually."
            echo "# Re-run 'pnpm sync-secrets' to refresh. Last synced: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "#"
            echo "# Multi-line values are base64-encoded as <NAME>_BASE64, because this"
            echo "# file is one KEY=VALUE per line."
            echo ""
          } > secrets-plain.txt

          COUNT=0
          for VAR in $(compgen -e | grep '^S_' | sort); do
            NAME="${VAR#S_}"
            VAL="${!VAR}"
            case "$VAL" in
              *$'\n'*)
                printf '%s_BASE64=%s\n' "$NAME" "$(printf '%s' "$VAL" | base64 -w 0)" >> secrets-plain.txt
                ;;
              *)
                printf '%s=%s\n' "$NAME" "$VAL" >> secrets-plain.txt
                ;;
            esac
            COUNT=$((COUNT + 1))
          done

          # This file overwrites a local backup, so a truncated write is worse
          # than no write at all.
          if [ "$COUNT" -lt 3 ]; then
            echo "::error::Only $COUNT secrets written — refusing to publish a truncated backup."
            exit 1
          fi

          {
            echo ""
            echo "# --- Captured locally, never synced ---"
            echo "# A real session JWT, valid about 60 seconds. Mint one right"
            echo "# before running 'pnpm test:idp'. See docs/phase-0-clerk-setup.md."
            echo "CLERK_SESSION_TOKEN="
          } >> secrets-plain.txt

          echo "Wrote $COUNT secrets."

      - name: Encrypt secrets file
        env:
          PASSPHRASE: ${{ inputs.passphrase }}
        run: |
          openssl aes-256-cbc -pbkdf2 -salt \
            -in secrets-plain.txt \
            -out secrets-encrypted.bin \
            -pass env:PASSPHRASE

      - name: Upload encrypted artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: secrets-encrypted
          path: secrets-encrypted.bin
          retention-days: 1
          if-no-files-found: error

      - name: Clean up unencrypted file
        if: always()
        run: rm -f secrets-plain.txt
