name: db-tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # No `version:` input on purpose. package.json pins packageManager with a
      # sha512 (matching candystore), and action-setup errors out if a version
      # is supplied in both places.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm secretlint
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm check:tools

      # Not pinned by SHA: neither sister repo uses this action, so there is no
      # established pin to mirror.
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - run: supabase start

      - run: pnpm test:db
