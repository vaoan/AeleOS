name: ci

on:
  push:
    branches: [main]
  pull_request:

# The job only reads the checkout. Declaring it explicitly stops the workflow
# inheriting a token wider than it needs — this repository is public.
permissions:
  contents: read

# One run per branch. Pushing twice in quick succession otherwise starts a
# second run that also pulls and boots a full Supabase stack. Runs on `main`
# are never cancelled: those results are the record of what landed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  conformance:
    runs-on: ubuntu-latest
    # The job settles around four minutes. This is a ceiling for a hung image
    # pull, not a target — without it a stuck run burns the full runner limit.
    timeout-minutes: 20
    steps:
      # fetch-depth: 0 because check:docs compares against the base branch and
      # a shallow clone has no base to compare with.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      # No `version:` input on purpose. package.json pins packageManager with a
      # sha512 (matching libra), and action-setup errors out if a version
      # is supplied in both places.
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm secretlint
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm check:tools
      - run: pnpm check:docs origin/${{ github.base_ref || 'main' }}

      # v3 is a composite action — no Node runtime, so it is unaffected by the
      # Node 20 deprecation. Pinned by SHA for the same supply-chain reason as
      # the others, even though no sister repo uses it.
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: latest

      - run: supabase start

      - run: pnpm test:db

  hub:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Coverage, not just tests: the branch threshold is what makes "test
      # every error path" a gate rather than an intention.
      - run: pnpm --filter hub test:coverage
      - run: pnpm --filter @aeleos/identity test:coverage
      - run: pnpm --filter hub build
        env:
          # Public by design — it ships in the browser bundle. The secret key
          # never enters CI.
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          # Optional, not a secret — Env defaults it to "" when absent, so a
          # deployment without this variable still boots. An empty
          # allowlist refuses every return_to; it's set explicitly here so
          # CI exercises the same shape production runs, not because the
          # app requires it.
          AELEOS_ALLOWED_RETURN_ORIGINS: ""

  # The browser-level proof, and until now nothing ran it. `tests/e2e/` holds
  # the only end-to-end evidence that the signed-out handoff works — a person
  # arriving from another app, signing in, and reaching the picker with their
  # `return_to` intact — and `docs/integrating.md` points an integrator at
  # picker.spec.ts by name as the thing that pins it. A suite no workflow
  # executes proves nothing: this one was red for a whole task and nobody
  # noticed, because nothing was looking.
  #
  # Secrets are withheld from fork pull requests, so the same guard as
  # idp-cloud applies: without it this would be a check that can never report
  # green on a fork.
  e2e:
    runs-on: ubuntu-latest
    # The dev server compiles on first request, so this is slower than the unit
    # suite. A ceiling for a hung server, not a target.
    timeout-minutes: 20
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Chromium alone: playwright.config.ts declares one project, so
      # installing the other two engines would download ~300MB nothing runs.
      - run: pnpm --filter hub exec playwright install --with-deps chromium

      # Playwright starts the dev server itself (webServer in the config), so
      # the server reads this environment. There is no .env.local on a runner.
      - run: pnpm --filter hub test:e2e
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          # Needed here and not in the `hub` job: clerkMiddleware authenticates
          # a real request, which a production build alone never does.
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          # Empty on purpose: every test here is anonymous and stops before the
          # picker page consults the allowlist, so CI needs no app's origin.
          AELEOS_ALLOWED_RETURN_ORIGINS: ""

      # The first run on a runner was red, and this artifact is what diagnosed
      # it. The prediction here was that SwiftShader would dither gradients
      # differently and break a numeric assertion on the nebula canvas; the
      # trace showed a canvas still at its 300x150 intrinsic size, so the
      # renderer was never the problem — `waitForNebulaReady` was, and the
      # assertion was reporting a blank canvas honestly. SwiftShader paints the
      # field at the same coverage a GPU does. Keep the upload: trace:
      # "on-first-retry" (playwright.config.ts) writes to test-results/ on any
      # retry, but nothing keeps that output past the job, and a canvas failure
      # is a bare red X without it.
      - name: Upload Playwright output on failure
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: playwright-report
          path: |
            apps/hub/test-results/
            apps/hub/playwright-report/
          if-no-files-found: ignore
          retention-days: 3

  # The cost guard, on its own check and on its own trigger.
  #
  # It drives a real browser through every canvas in the app at the top of both
  # dials, and then through the largest personalised page the database will
  # accept on a throttled phone — minutes of work whose answer almost never
  # changes. So it does that work when the answer CAN have changed: a canvas
  # added to `CANVAS_SLOTS`, or a change to anything that decides what a page
  # costs to paint. Everything else — a migration, a translation, a copy change
  # — steps past it in seconds.
  #
  # **`isCanvasSource` was too narrow and that is why this is worth reading.**
  # It matched only modules named for a canvas, so #150 through #155 — every
  # skin, layout, section-style and page-background change — skipped the
  # expensive half on all six runs. It now also watches `skins.ts`,
  # `globals.css`, `actor-theme.ts`, `blocks.tsx`/`block-style.ts` and the whole
  # actors presentation directory.
  #
  # **The job always runs; only its expensive half is conditional.** Guarding
  # the whole job with `if:` would leave a check that never reports on most pull
  # requests, and a required check that never reports blocks the merge for ever.
  # This way it reports green either way and the log says which it did and why.
  #
  # The two triggers and why it fails open are in
  # `scripts/canvas-suite-needed.mjs`.
  #
  # 🧑 **This check is still not REQUIRED, and only a maintainer can change
  # that.** The required list lives in repository settings rather than in this
  # file, so nothing here can say so and nothing here will fail if it is wrong:
  #
  #     gh api repos/vaoan/AeleOS/branches/main/protection/required_status_checks --jq '.contexts'
  #     → ["conformance","hub","idp-cloud","e2e"]
  #
  # Until `canvas` joins that list it can go red without stopping a merge, which
  # is one step from a check that does nothing — and the two faults this job
  # now guards against both shipped to `main` under a green tick.
  canvas:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Same fork guard as `e2e`: the dev server needs Clerk keys to boot.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      # fetch-depth: 0 so the base branch exists to compare the table against.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Does this change need measuring?
        id: needed
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/canvas-suite-needed.mjs "$BASE" >> "$GITHUB_OUTPUT"

      - name: Install Chromium
        if: steps.needed.outputs.run == 'true'
        run: pnpm --filter hub exec playwright install --with-deps chromium

      # Every canvas at the top of both dials, and then the personalised page
      # budget on a throttled phone — `playwright.config.ts`'s `canvas` project
      # owns both.
      - name: Measure every canvas, and what a personalised page costs
        if: steps.needed.outputs.run == 'true'
        run: pnpm --filter hub test:canvas
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          AELEOS_ALLOWED_RETURN_ORIGINS: ""

      - name: Upload Playwright output on failure
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: canvas-report
          path: |
            apps/hub/test-results/
            apps/hub/playwright-report/
          if-no-files-found: ignore
          retention-days: 3

  # The only check that looks at the database the app actually runs against.
  #
  # `conformance` above resets and rebuilds a FRESH database from every file in
  # `supabase/migrations/`, so an in-place edit is always present in the schema
  # it exercises — by construction, whether or not that edit ever reached the
  # live project. And the migration set is squashed so that every object is
  # defined exactly once, which makes an edit in place the normal way to change
  # a function. Supabase records the file as applied and `db push` will not
  # re-run an applied file. Those two facts together are a hole, and something
  # fell through it: `set_actor_sections()` on the live project was missing its
  # entire per-section style-validation block for five merged pull requests,
  # with every check green the whole time — and the `actor_profiles.sections`
  # column comment, the one signal this repo's conventions ask to be kept in
  # step, was current, so it was truthful about the file and false about the
  # database. Why the check is shaped the way it is — which diff engines, and
  # which of them is honest about a failure — is in
  # `scripts/check-schema-drift.mjs`.
  #
  # Same fork guard as `idp-cloud`: this needs the project's database password,
  # and secrets are withheld from fork pull requests, so without the guard it
  # would be a check that can never report green there.
  #
  # 🧑 **Making this a REQUIRED check is repository settings, not this file.**
  # The required-check list lives in branch protection and the two can disagree
  # without anything failing — `e2e` was made required after the fact and
  # nothing in this directory says so. Until a maintainer adds `schema-drift`,
  # a merge can ignore it. Read the current list, never infer it from here:
  #   gh api repos/vaoan/AeleOS/branches/main/protection/required_status_checks --jq '.contexts'
  #
  # ⚠️ **Settle this before requiring it: the check does not serialise, and
  # the remedy for its main finding does.** It compares LIVE against THE
  # BRANCH's migrations, and the only way a branch that edits a migration in
  # place goes green is a hand-push to live — which makes live the newer side
  # for everybody. So pull request A's route to green turns B, C and `main`
  # red for the whole window until A merges, and nothing B's author can do
  # fixes B. If A is then abandoned, live is stranded ahead of `main` with no
  # rollback and no record of what was pushed. Required, that is a merge queue
  # of one enforced by nothing, and an undocumented deadlock is how a check
  # gets disabled in anger. Three ways out, and one of them has to be chosen
  # rather than discovered:
  #   1. Diff live against `origin/main`'s migrations instead of the branch's,
  #      keeping the branch's own diff as information. "Drift" then means
  #      "`main` and live disagree" — the actual invariant, and one no open
  #      pull request can move. Preferred.
  #   2. Keep it as it is and write the serialisation rule down: hand-push is
  #      the LAST step before a merge, one pull request at a time, and an
  #      abandoned push is reversed by hand. `check-schema-drift.mjs` already
  #      prints this beside the remedy it applies to.
  #   3. Leave it non-required, which is what this file honestly says today.
  schema-drift:
    runs-on: ubuntu-latest
    # Every pass builds its own shadow database and pulls its own engine image.
    # Settles in a few minutes; this is a ceiling for a hung pull, not a target.
    timeout-minutes: 20
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # No supabase/setup-cli here, unlike `conformance`. The script runs the
      # `supabase` devDependency, so the version comparing the schemas is the one
      # `--frozen-lockfile` just installed rather than whatever `latest` resolved
      # to this morning.
      #
      # **That is not a pin, and this comment used to imply it was.**
      # package.json's range is a caret; the lockfile is the only thing holding
      # the version, and `--frozen-lockfile` is the only thing holding the
      # lockfile. So the engine still moves whenever the lockfile is updated —
      # a `pnpm up`, a Dependabot bump, a resolution changed by an unrelated
      # package — and nothing about that is visible from this file. It matters
      # because migra reports "the two disagree" and "these two were never
      # going to compare equal" identically: a CLI bump can arrive dressed as
      # schema drift. `check-schema-drift.mjs` prints the CLI version and the
      # shadow database's PostgreSQL major on every run and repeats both in the
      # failure, so a run that goes red for no reason in the diff can be
      # compared against the last green one. Pin the range exactly if that
      # stops being enough.
      #
      # Docker comes with the runner; the CLI needs it to build the shadow
      # database.
      - run: pnpm check:schema-drift
        env:
          # The only secret this needs. The project is a constant inside the
          # script — no ref, host or URL is read from the environment, so this
          # cannot be aimed at Libra by a mistyped variable.
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

  idp-cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Secrets are withheld from fork pull requests, so this job cannot pass
    # there. Without the guard it would be a check that can never report green.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Write .secrets for the runner
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_DOMAIN: ${{ secrets.CLERK_DOMAIN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          {
            echo "CLERK_SECRET_KEY=${CLERK_SECRET_KEY}"
            echo "CLERK_DOMAIN=${CLERK_DOMAIN}"
            echo "SUPABASE_ACCESS_TOKEN=${SUPABASE_ACCESS_TOKEN}"
            echo "SUPABASE_DB_PASSWORD=${SUPABASE_DB_PASSWORD}"
          } > .secrets
      - run: pnpm test:idp:cloud
      - name: Remove .secrets
        if: always()
        run: rm -f .secrets
