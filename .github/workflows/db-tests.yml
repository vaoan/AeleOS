name: db-tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm secretlint
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - run: supabase start

      - run: pnpm test:db
